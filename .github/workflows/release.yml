name: cpcopy Release
on:
  push:
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: cpcopy
jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cpcopy
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cpcopy -> target
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYVERSION'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag must match package version v{version}")
          PYVERSION
      - run: cargo package --locked
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: cpcopy/target/package/*.crate
          if-no-files-found: error

  binaries:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: cpcopy
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: cpcopy -> target
      - run: cargo build --release --all-features --bin cpcopy --target "$TARGET" --locked
      - run: cargo test --release --all-features --target "$TARGET" --locked
      - name: Package binary and license
        run: |
          python3 - <<'PYBINARY'
          import os, pathlib, shutil, tarfile
          target = os.environ['TARGET']
          directory = f"cpcopy-{os.environ['RELEASE_TAG']}-{target}"
          output = pathlib.Path('dist') / directory
          output.mkdir(parents=True)
          executable = 'cpcopy.exe' if 'windows' in target else 'cpcopy'
          shutil.copy2(pathlib.Path('target') / target / 'release' / executable, output / executable)
          for name in ['README.md', 'LICENSE']:
              shutil.copy2(name, output / name)
          with tarfile.open(f'dist/{directory}.tar.gz', 'w:gz') as archive:
              archive.add(output, arcname=directory)
          PYBINARY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: cpcopy/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: [package, binaries]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: cpcopy
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cpcopy -> target
      - run: python3 scripts/publish-crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [package, binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish verified artifacts and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(*.crate *.tar.gz)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}" "${files[@]}" SHA256SUMS
